<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#grad)"/>
  
  <!-- Camera body -->
  <rect x="20" y="40" width="88" height="60" rx="8" fill="white"/>
  
  <!-- Lens -->
  <circle cx="64" cy="70" r="20" fill="#667eea"/>
  <circle cx="64" cy="70" r="12" fill="white" opacity="0.3"/>
  
  <!-- Viewfinder -->
  <rect x="85" y="48" width="14" height="10" rx="2" fill="#667eea"/>
  
  <!-- Flash -->
  <circle cx="35" cy="50" r="4" fill="#fbbf24"/>
</svg>
